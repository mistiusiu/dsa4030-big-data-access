[project]
name = "smartcity-access-lab"
version = "0.1.0"
description = "Smart city big data access lab: DuckDB over Parquet behind a role-based permission grid"
authors = [{ name = "Misati Nyambane", email = "mohadek2004@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "django (>=6.0,<6.1)",
    "djangorestframework (>=3.16,<4.0)",
    "djangorestframework-simplejwt[crypto] (>=5.5,<6.0)",
    "django-cors-headers (>=4.7,<5.0)",
    "duckdb (>=1.4,<2.0)",
    "pyarrow (>=21.0)",
    "psycopg[binary] (>=3.2,<4.0)",
    "gunicorn (>=23.0)",
    "whitenoise (>=6.9,<7.0)",
    "cryptography (>=45.0)",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=8.4)",
    "pytest-django (>=4.11)",
    "ruff (>=0.12)",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
